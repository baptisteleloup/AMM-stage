# Override used by skew.sh: runs node-4 on the faketime image with its clock shifted by $SKEW
# (e.g. +2s, -30s). Only that container's time changes, the host clock is untouched.
services:
  node-4:
    image: besu-faketime:${BESU_VERSION:-26.8.1}
    environment:
      - SKEW=${SKEW:-+0s} # clock offset read by the faketime entrypoint
      - FAKETIME_DONT_FAKE_MONOTONIC=1 # shift wall-clock time only, keep JVM timers sane
      - BESU_USING_JEMALLOC=false # else Besu's launcher overwrites LD_PRELOAD and drops libfaketime
